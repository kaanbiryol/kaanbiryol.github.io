<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">Design system autocomplete with and without a prefix</title>
  <desc id="description">Two code editor panels compare a broad modifier list after typing a period with a focused list containing dsSize and dsVariant after typing dot ds.</desc>

  <rect width="1200" height="660" fill="#f6f6f2" />

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect x="42" y="42" width="536" height="576" rx="20" fill="#ffffff" stroke="#d8d8d2" stroke-width="2" />
    <text x="76" y="92" fill="#1c2440" font-size="26" font-weight="700">Without prefix</text>

    <rect x="72" y="120" width="476" height="462" rx="12" fill="#fbfbfa" stroke="#deded9" stroke-width="2" />
    <line x1="126" y1="120" x2="126" y2="582" stroke="#e5e5e0" stroke-width="2" />

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">
      <text x="96" y="158" fill="#898991" text-anchor="middle">1</text>
      <text x="148" y="158" fill="#24242b">DSButton("Continue") {</text>
      <text x="96" y="198" fill="#898991" text-anchor="middle">2</text>
      <text x="172" y="198" fill="#24242b">submit()</text>
      <text x="96" y="238" fill="#898991" text-anchor="middle">3</text>
      <text x="148" y="238" fill="#24242b">}.</text>
      <rect x="172" y="213" width="2" height="30" fill="#24242b" />
    </g>

    <g transform="translate(142 250)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <rect width="376" height="288" rx="12" fill="#ffffff" stroke="#c9c9c4" stroke-width="2" />
      <g fill="#5e5ec7">
        <rect x="16" y="13" width="28" height="28" rx="6" /><rect x="16" y="61" width="28" height="28" rx="6" />
        <rect x="16" y="109" width="28" height="28" rx="6" /><rect x="16" y="157" width="28" height="28" rx="6" />
        <rect x="16" y="205" width="28" height="28" rx="6" /><rect x="16" y="253" width="28" height="28" rx="6" />
      </g>
      <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle">
        <text x="30" y="33">M</text><text x="30" y="81">M</text><text x="30" y="129">M</text>
        <text x="30" y="177">M</text><text x="30" y="225">M</text><text x="30" y="273">M</text>
      </g>
      <g stroke="#ecece8">
        <line x1="0" y1="48" x2="376" y2="48" /><line x1="0" y1="96" x2="376" y2="96" />
        <line x1="0" y1="144" x2="376" y2="144" /><line x1="0" y1="192" x2="376" y2="192" />
        <line x1="0" y1="240" x2="376" y2="240" />
      </g>
      <g fill="#24242b" font-size="17">
        <text x="60" y="34">accessibilityHint(_:)</text><text x="60" y="82">buttonStyle(_:)</text>
        <text x="60" y="130">controlSize(_:)</text><text x="60" y="178">frame(...)</text>
        <text x="60" y="226">padding(_:)</text><text x="60" y="274">tint(_:)</text>
      </g>
    </g>

    <rect x="622" y="42" width="536" height="576" rx="20" fill="#ffffff" stroke="#d8d8d2" stroke-width="2" />
    <text x="656" y="92" fill="#1c2440" font-size="26" font-weight="700">With .ds prefix</text>

    <rect x="652" y="120" width="476" height="462" rx="12" fill="#fbfbfa" stroke="#deded9" stroke-width="2" />
    <line x1="706" y1="120" x2="706" y2="582" stroke="#e5e5e0" stroke-width="2" />

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="20">
      <text x="676" y="158" fill="#898991" text-anchor="middle">1</text>
      <text x="728" y="158" fill="#24242b">DSButton("Continue") {</text>
      <text x="676" y="198" fill="#898991" text-anchor="middle">2</text>
      <text x="752" y="198" fill="#24242b">submit()</text>
      <text x="676" y="238" fill="#898991" text-anchor="middle">3</text>
      <text x="728" y="238" fill="#24242b">}.ds</text>
      <rect x="776" y="213" width="2" height="30" fill="#24242b" />
    </g>

    <g transform="translate(720 250)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <rect width="400" height="98" rx="12" fill="#ffffff" stroke="#c9c9c4" stroke-width="2" />
      <rect x="7" y="7" width="386" height="42" rx="7" fill="#e8e9ff" />
      <rect x="16" y="13" width="28" height="28" rx="6" fill="#5e5ee8" /><rect x="16" y="61" width="28" height="28" rx="6" fill="#5e5ec7" />
      <g fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="middle">
        <text x="30" y="33">M</text><text x="30" y="81">M</text>
      </g>
      <line x1="0" y1="49" x2="400" y2="49" stroke="#ecece8" />
      <g fill="#24242b" font-size="15"><text x="60" y="34">dsSize(size: DSButton.Size)</text><text x="60" y="82">dsVariant(variant: DSButton.Variant)</text></g>
    </g>
  </g>
</svg>
